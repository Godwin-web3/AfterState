[package]
name = "afterstate-near-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afterstate-near-foreign-tx-fixtures = { path = "../foreign-tx-fixtures" }
near-mpc-contract-interface = { git = "https://github.com/near/mpc", rev = "e691bdb98d68dcf74653da58d043453a6318765f", package = "near-mpc-contract-interface" }
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
