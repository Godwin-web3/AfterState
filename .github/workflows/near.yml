name: NEAR ForeignTx Fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "near/foreign-tx-fixtures/**"
      - "near/adapter/**"
      - ".github/workflows/near.yml"
  pull_request:
    branches: [main]
    paths:
      - "near/foreign-tx-fixtures/**"
      - "near/adapter/**"
      - ".github/workflows/near.yml"

permissions:
  contents: read

jobs:
  foreign-tx-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run pinned MPC serialization fixtures
        run: |
          cargo test --manifest-path near/foreign-tx-fixtures/Cargo.toml
          cargo test --manifest-path near/adapter/Cargo.toml
          cargo check --manifest-path near/adapter/Cargo.toml --target wasm32-unknown-unknown
          cargo build --release --manifest-path near/adapter/Cargo.toml --target wasm32-unknown-unknown
      - name: Upload NEAR adapter WASM
        uses: actions/upload-artifact@v4
        with:
          name: afterstate-near-adapter-wasm
          path: target/wasm32-unknown-unknown/release/afterstate_near_adapter.wasm
          if-no-files-found: error
