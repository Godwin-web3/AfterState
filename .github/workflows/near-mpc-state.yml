name: NEAR MPC Testnet State

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/near-mpc-state.yml"
      - "near/scripts/query-mpc-testnet.sh"
      - "near/foreign-tx-fixtures/**"
  workflow_dispatch:
    inputs:
      foreign_tx_domain_id:
        description: "Live ForeignTx-purpose domain ID from the returned contract state"
        required: false
        type: string
        default: ""
      adapter_account_id:
        description: "Intended or deployed AfterState NEAR adapter account ID (derives EVM signer before deployment)"
        required: false
        type: string
        default: ""
      sign_domain_id:
        description: "Live Sign-purpose domain ID from the returned contract state"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  inspect-mpc-testnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Query live NEAR MPC testnet views
        env:
          FOREIGN_TX_DOMAIN_ID: ${{ inputs.foreign_tx_domain_id }}
          ADAPTER_ACCOUNT_ID: ${{ inputs.adapter_account_id }}
          SIGN_DOMAIN_ID: ${{ inputs.sign_domain_id }}
        run: bash near/scripts/query-mpc-testnet.sh
      - name: Upload public contract state report
        uses: actions/upload-artifact@v4
        with:
          name: near-mpc-testnet-state
          path: near-mpc-state/report.json
          if-no-files-found: error
